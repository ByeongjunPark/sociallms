<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>활동 템플릿 🌸</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* 활동 페이지 전용 파스텔 테마 확장 */
    .activity-container {
      max-width: 760px;
      margin: 0 auto;
      padding-bottom: 80px;
      animation: fadeInUp 0.6s ease;
    }
    .card-activity {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 28px;
      padding: 32px;
      box-shadow: var(--shadow-primary);
      backdrop-filter: blur(12px);
      margin-bottom: 24px;
    }
    .student-badge {
      font-size: 0.9rem;
      background: var(--color-purple-soft);
      color: var(--color-purple);
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 12px;
    }
    .activity-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .activity-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .submit-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 32px;
    }
    .btn-submit {
      background: linear-gradient(135deg, var(--color-pink) 0%, var(--color-purple) 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 18px;
      font-family: var(--font-family-body);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 20px -8px rgba(184, 150, 219, 0.6);
      transition: all 0.3s ease;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -10px rgba(184, 150, 219, 0.8);
    }
  </style>
</head>
<body>
  <div class="activity-page">
    <!-- 상단 탐색 네비게이션 -->
    <a href="../index.html" class="activity-back-link">🌸 대시보드로 돌아가기</a>
    
    <div class="activity-container">
      <!-- 학생 기본 정보 위젯 -->
      <div style="text-align: right; margin-bottom: 16px;">
        <span class="student-badge" id="studentBadge">👧 설정된 학생 없음</span>
      </div>

      <!-- 메인 활동 카드 -->
      <main class="card-activity">
        <h2 class="activity-title">활동 제목이 들어갑니다 🌸</h2>
        <p class="activity-subtitle">성취기준과 탐구 목표에 대한 가이드 설명이 여기에 들어갑니다. 아래 지시에 따라 활동을 진행해 주세요.</p>
        
        <!-- 이 영역에 활동 세부 콘텐츠가 구현됩니다. -->
        <div class="content-area" style="padding: 40px 20px; text-align: center; border: 2px dashed rgba(0,0,0,0.1); border-radius: 20px;">
          여기에 활동 내용(활동지 폼, 챗봇 창, 시뮬레이터)을 바이브코딩으로 자유롭게 개발하세요!
        </div>

        <!-- 하단 제출 및 완료 버튼 -->
        <div class="submit-bar">
          <span style="font-size: 0.9rem; color: var(--text-secondary);">활동을 마치면 완료 버튼을 눌러주세요.</span>
          <button class="btn-submit" onclick="completeActivity()">배움 완료하기 ✨</button>
        </div>
      </main>
    </div>
  </div>

  <script>
    // 현재 활동의 ID 설정 (data.js에 등록된 ID와 일치해야 함)
    const ACTIVITY_ID = "template_activity"; 

    // 로드 시 학생 이름 표시 및 테마 로드
    document.addEventListener("DOMContentLoaded", () => {
      // 테마 동기화
      const savedTheme = localStorage.getItem("sociallms_theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);

      // 학생 프로필 로드
      const savedProfile = localStorage.getItem("sociallms_profile");
      const badge = document.getElementById("studentBadge");
      if (savedProfile && badge) {
        const student = JSON.parse(savedProfile);
        badge.textContent = `${student.emoji} ${student.gradeClass ? student.gradeClass + ' ' : ''}${student.name} 학생`;
      }
    });

    // 활동 완료 처리
    function completeActivity() {
      const progress = JSON.parse(localStorage.getItem("sociallms_progress") || "{}");
      progress[ACTIVITY_ID] = "completed";
      localStorage.setItem("sociallms_progress", JSON.stringify(progress));
      
      alert("오늘 배움을 멋지게 끝마쳤어요! 참 잘했어요 🌸");
      window.location.href = "../index.html";
    }
  </script>
</body>
</html>
